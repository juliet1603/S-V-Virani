
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="Beautiful landscape for a travel blog"
    >

    <div class="post-content">
      <h2 class="post-title">
        Explore the World of Technology
      </h2>

      <p class="post-excerpt">
        Discover the latest trends in technology,
        programming, and web development.
        Learn new skills and explore exciting
        opportunities in the digital world.
      </p>

      <a
        class="read-more"
        href="https://www.freecodecamp.org/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read More
      </a>
    </div>
  </div>

</body>
</html>
