
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>My To-Do List</h1>

    <ul class="todo-list">
      <li>
        <input type="checkbox" id="task1">
        <label for="task1">Learn HTML</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link"
               href="https://www.freecodecamp.org/learn"
               target="_blank">HTML Tutorial</a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="task2">
        <label for="task2">Practice CSS</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link"
               href="https://developer.mozilla.org/en-US/docs/Web/CSS"
               target="_blank">CSS Documentation</a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="task3">
        <label for="task3">Learn JavaScript</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link"
               href="https://javascript.info/"
               target="_blank">JavaScript Tutorial</a>
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="task4">
        <label for="task4">Build a Website</label>
        <ul class="sub-item">
          <li>
            <a class="sub-item-link"
               href="https://www.w3schools.com/"
               target="_blank">Web Development Guide</a>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</body>
</html>
