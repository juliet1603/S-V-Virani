<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
    <style>
        p{
            filter: ;
        }
    </style>
</head>
<body>
    <h1>Filter</h1>
    <img src="1.jpg" height="200px" width="200px">
    <img src="1.jpg" height="200px" width="200px" style="filter:brightness(150%)">
    <img src="1.jpg" height="200px" width="200px" style="filter: blur(2px);">
    <img src="1.jpg" height="200px" width="200px" style="filter:invert(60%);">
    <img src="1.jpg" height="200px" width="200px" style="filter:saturate(130%);">
    <img src="1.jpg" height="200px" width="200px" style="filter:drop-shadow(45px 25px 10px);"><br>
    <img src="1.jpg" height="200px" width="200px" style="filter:grayscale(70%);">
    <img src="1.jpg" height="200px" width="200px" style="filter:sepia(100%);">
    <img src="1.jpg" height="200px" width="200px" style="filter:hue-rotate(240deg);">
    <img src="1.jpg" height="200px" width="200px" style="filter:contrast(130%);">
    <img src="1.jpg" height="200px" width="200px" style="filter:opacity(60%);">
</body>
</html>
