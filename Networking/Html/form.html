<html>
    <head>
        <title>Form</title>
    </head>
    <body bgcolor="#90EE90">
        <form>
            <h3>Step 1: Your details</h3>
            <fieldset>
                <Label for="name">Name: </Label>
                <input type="text" id="name" placeholder="First & last name" required>
            </fieldset>
            <fieldset>
                <label for="email">Email: </label>
                <input type="email" id="email" placeholder="Email address" required>
            </fieldset>
            <fieldset>
                <label for="Phone">Phone: </label>
                <input type="number" id="Phone" placeholder="+9429400601" required>
            </fieldset>
            <br>
            <h3>Step 2: Delivery address</h3>
            <fieldset>
                <label for="address">Address: </label>
                <textarea id="address" placeholder="Address" required></textarea>
            </fieldset>
            <fieldset>
                <label for="pincode">Post Code: </label>
                <input type="text" id="pincode" placeholder="Post code" required>
            </fieldset>
            <fieldset>
                <label for="country">Country: </label>
                <input type="text" id="country" placeholder="Country" required>
            </fieldset>
            <br>
            <h3>Step 3: Card details</h3>
            <fieldset>
                <label for="card type">Card Type </label><br>
                <input type="radio" id="card type" name="card type"  required>
                <label for="card type">Visa</label>
                <input type="radio" id="card type" name="card type"  required>
                <label for="card type">AmEx</label>
                <input type="radio" id="card type" name="card type"  required>
                <label for="card type">MasterCard</label>
            </fieldset>
            <fieldset>
                <label for="card number">Card Number: </label>
                <input type="text" id="card number" placeholder="Card number" required>
            </fieldset>
            <fieldset>
                <label for="Security Code">Security Code: </label>
                <input type="password" id="Security Code" placeholder="3-digit code on back" required>
            </fieldset>
            <fieldset>
                <label for="name as">Name on Card: </label>
                <input type="text" id="name as" placeholder="Exact name as on the card" required>
            </fieldset>
            <br>
            <center><input type="submit" value="BUY IT!"></center>
        </form>
    </body>
</html>
