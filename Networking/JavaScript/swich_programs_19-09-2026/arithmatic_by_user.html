<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = parseFloat(prompt("enter 1st number"));
        b = parseFloat(prompt("enter 2st number"));
        c =prompt("which opration you want (e.g. + , - ,* ,/)");

        switch(c){
            case "+": document.write(a + b);
            break;
            case "-": document.write(a - b);
            break;
            case "*": document.write(a * b);
            break;
            case "/": document.write(a / b);
            break;
        }
    </script>
</body>
</html>
