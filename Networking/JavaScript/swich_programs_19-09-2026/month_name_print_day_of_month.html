<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        month = prompt("Enter mounth name this way January = jan in lower case.");

        switch(month){
            case "jan": document.write("31");
            break;
            case "feb": document.write("28/29");
            break;
            case "mar": document.write("31");
            break;
            case "aep": document.write("30");
            break;
            case "may": document.write("31");
            break;
            case "jun": document.write("30");
            break;
            case "jul": document.write("31");
            break;
            case "aug": document.write("31");
            break;
            case "sep": document.write("30");
            break;
            case "oct": document.write("31");
            break;
            case "nav": document.write("30");
            break;
            case "dec": document.write("31");
            break;
            default : document.write("Wrong input");
            break;
        }
    </script>
</body>
</html>
