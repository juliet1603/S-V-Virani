<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days</title>
</head>
<body>
    <script>
        document.write("<center>")
        num = parseInt(prompt("Enter Number 1 to 7"));

        switch(num){

            case 1: document.write("Sunday");
            break;
            case 2: document.write("Monday");
            break;
            case 3: document.write("Teusday");
            break;
            case 4: document.write("Wednesday");
            break;
            case 5: document.write("Thurday");
            break;
            case 6: document.write("Friday");
            break;
            case 7: document.write("Seturday");
            break;
            default: document.write("Wrong input");
            break;
        }
        document.write("</center>")
    </script>
</body>
</html>
