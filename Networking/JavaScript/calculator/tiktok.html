<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .par{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 5px;
        }
        .cell{
            height: 100px;
            width: 100px;
            font-size: 24px;
            cursor: pointer;
            background-color: pink;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>Tic tok</h1>
    <div class="par">
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        <div class="cell" onclick="play(this)"></div>
        
    </div>
    <script>
        var turn = 'X';

        function play(cell) {
            if(cell.innerText === ''){
                cell.innerText = turn;
                turn = turn === 'X'?'0':'X';
            }
        }
    </script>
</body>
</html>
