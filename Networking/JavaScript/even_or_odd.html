<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or odd.</title>
    <script>
        function chack(){
           a =parseFloat(even_odd.num.value);
           b = a % 2;
           if(b == 0){
                document.write("The number is Even");
           }else{
            document.write("The number is Odd");
           }
        }
        
    </script>

</head>
<body>
    <form name="even_odd">
        <input type="number" name="num"> <br>
        <input type="button" name="click" onclick="chack()" value="click">
    </form>
</body>
</html>
