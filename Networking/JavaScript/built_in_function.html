<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Built_in_function</title>
</head>
<body>
    <script>
        var rno = 5;
        document.write(typeof rno + "<br>");

        let name = "jaimin";
        document.write(typeof name + "<br>"); 

        marks = 20.5;
        document.write(typeof marks + "<br>");

        result = false;
        document.write(typeof result + "<br>");

        a = "true"
        document.write(typeof a + "<br>");

        a = Boolean(a);
        document.write(typeof a + "<br>");

        num = "25"
        document.write(typeof num + "<br>");

        num = Number(num);
        document.write(typeof num + "<br>");

        num = parseFloat(num);
        document.write(typeof num + num);

        htr = "welcome to 25th century"
        htr = Number(htr);
        document.write(typeof htr + htr);

        document.write(isNaN("jaimin"));

        document.write(eval("10 + 20 - 5"));

    </script>
</body>
</html>
