<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = prompt("Enter a number:");
        c = a % 2;

        if(c == 0){
            document.write("Given number is Even");
        }else{
            document.write("Given number is Odd");
        }
    </script>
</body>
</html>
