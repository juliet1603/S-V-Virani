<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
     a = prompt("Enter 1st number :");
     b = prompt("Enter 2nd number :");

     if(a > b){
        document.write("Maximum number is :" + a);
     }
     else{
        document.write("Maximum number is :" + b);
     }
    </script>
</body>
</html>
