<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = prompt("Enter 1st Number");
        b = prompt("Enter 2nd Number");
        c = prompt("Enter 3rd Number");
        d = prompt("Enter 4th Number");

        if( a < b && a < c && a < d){
            document.write("The minumum number is :" + a);
        }
        else if(b < a && b < c && b < d){
            document.write("The minumum number is :" + b);
        }
        else if(c < a && c < b && c < d){
            document.write("The minumum number is :" + c);
        }
        else{
            document.write("The minumum number is :" + d);
        }
    </script>
</body>
</html>
