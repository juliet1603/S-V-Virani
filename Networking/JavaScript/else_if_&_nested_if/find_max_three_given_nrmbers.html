<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = prompt("Enter 1st number");
        b = prompt("Enter 2nd number");
        c = prompt("Enter 3rd number");

        if( a > b && a > c){
            document.write("The maximun mumber is : " + a);
        }
        else if(b > a && b > c){
            document.write("The maximun mumber is : " + b);
        }
        else{
            document.write("The maximun mumber is : " + c);
        }
    </script>
</body>
</html>
