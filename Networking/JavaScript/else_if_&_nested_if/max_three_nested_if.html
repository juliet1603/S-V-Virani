<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter 1st Number"));
        b = parseInt(prompt("Enter 2nd Number"));
        c = parseInt(prompt("Enter 3rd Number"));

        if( a > b){
            if(a > c){
                document.write("The maximun mumber is : " + a);
            }
        }else if(b > a){
            if(b > c){
                document.write("The maximun mumber is : " + b);
            }
        }else{
            document.write("The maximun mumber is : " + c);
        }
    </script>
</body>
</html>
