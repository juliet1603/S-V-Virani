<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return</title>
</head>
<body>
    <script>
        function ADD(a , b) {

            alert("You are under arrest");

            return a + b;
        }

        let addition = ADD(10 , 5);
        console.log(addition);

       
         function SUB(a , b) {

            return a - b;
        }

        let subtraction = SUB(10 , 5);
        console.log(subtraction);

        function MUL(a , b) {

            return a * b;
        }

        let multiplication = MUL(10 , 5);
        console.log(multiplication);

        function DIV(a , b) {

            return a / b;
        }

        let division = DIV(10 , 5);
        console.log(division);
        
    </script>
</body>
</html>
