<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required placeholder="Enter your first name">
            <br><br>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required placeholder="Enter your last name">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
            <br><br>
            <label for="Password">Password:</label>
            <input type="password" id="Password" name="Password" required placeholder="Enter your password">
            <br><br>
            <label for="Mobile Number">Mobile number:</label>
            <input type="tel" id="phone" name="Mobile Number" required placeholder="Enter your mobile number">
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required placeholder="Enter your age">
            <br><br>
            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color" required>
        </fieldset>
        <br>
        <fieldset>
            <legend>Gender</legend>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male" required>
            
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female" required>
            
            <label for="other">Other</label>
            <input type="radio" id="other" name="gender" value="other" required>
        </fieldset>
        <br>
        <fieldset>
            <legend>Skills</legend>
            <label for="html">HTML</label>
            <input type="checkbox" id="html" name="skills" value="HTML">
            
            <label for="css">CSS</label>
            <input type="checkbox" id="css" name="skills" value="CSS">
            
            <label for="js">JavaScript</label>
            <input type="checkbox" id="js" name="skills" value="JavaScript">

            <label for="react">React</label>
            <input type="checkbox" id="react" name="skills" value="React">
        </fieldset>
        <br>
        <fieldset>
            <legend>Education</legend>
            <label for="select">Select your highest qualification:</label>
            <select id="select" name="education" required>
                <option value="">-- Select --</option>
              <optgroup label="Undergraduate">
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="B.com">B.Com</option>
                </optgroup>
                <optgroup label="Postgraduate">
                    <option value="MCA">MCA</option>
                    <option value="MBA">MBA</option>
                    <option value="MSc">MSc</option>
                </optgroup>
            </select>
        </fieldset>
        <br>
        <fieldset>
            <legend>City</legend>
            <label for="city">Choose your city:</label>
            <input type="text" id="city" name="city" required placeholder="Enter your city">
        </fieldset>
        <br>
        <fieldset>
            <legend>Additional Information</legend>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" required placeholder="Enter your address"></textarea>
            <br><br>
            <label for="photo">Upload your photo:</label>
            <input type="file" id="photo" name="photo" required>
            <br><br>
            <label for="website">Website:</label>
            <input type="url" id="website" name="website" placeholder="Enter your website URL">
            <br><br>
            <label for="course">Search Course:</label>
            <input type="text" id="course" name="course" placeholder="Search">
            <br><br>
            <label for="time">Preferred Time:</label>
            <input type="time" id="time" name="time">
            
        </fieldset>

    </form>
</body>
</html>
